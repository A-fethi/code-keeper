# get informations 
- name: Get GitLab project information
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/code-keeper%2F{{ item }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
  register: project_info
  loop:
    - terraform
    - api-gateway
    - inventory
    - billing

# auto trigger PR from "test" to "main" for all 4 microservices
- name: Create Merge Requests from test to main
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects/{{ item.json.id }}/merge_requests"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: form-urlencoded
    body:
      source_branch: "test"
      target_branch: "main"
      title: "Promote test to main"
      description: |
        Automated merge request created by Ansible.

        This MR promotes the test branch to main.

        Please review and merge when ready.
      remove_source_branch: false
    status_code:
      - 201
      - 409
  loop: "{{ project_info.results }}"
  no_log: true