---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - tzdata
      - perl
    state: present
    update_cache: true

- name: Download GitLab CE repository setup script
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh
    dest: /tmp/gitlab_ce_script.deb.sh
    mode: '0755'

- name: Run GitLab CE repository setup script
  ansible.builtin.command:
    cmd: bash /tmp/gitlab_ce_script.deb.sh
    creates: /etc/apt/sources.list.d/gitlab_gitlab-ce.list

- name: Install GitLab CE package
  ansible.builtin.apt:
    name: gitlab-ce
    state: present
    update_cache: true

- name: Deploy GitLab configuration file (/etc/gitlab/gitlab.rb)
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: '0600'
  notify: Reconfigure GitLab

- name: Apply configuration if changed
  ansible.builtin.meta: flush_handlers

- name: Wait for GitLab web service to respond
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/users/sign_in"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 10

- name: Generate Admin Personal Access Token via gitlab-rails
  ansible.builtin.shell: |
    gitlab-rails runner "
      user = User.find_by_username('root')
      token = user.personal_access_tokens.find_by(name: 'ansible-iac-token')
      if token.nil?
        token = user.personal_access_tokens.create!(
          name: 'ansible-iac-token',
          scopes: ['api'],
          expires_at: 1.year.from_now
        )
        token.set_token('{{ gitlab_api_token }}')
        token.save!
      end
    "
  args:
    executable: /bin/bash
  register: token_gen_result
  changed_when: token_gen_result.rc == 0

- name: Ensure gitlab_api_token variable is defined
  ansible.builtin.set_fact:
    gitlab_api_token: "{{ gitlab_api_token | default('glpat-codekeepersecrettoken123') }}"

- name: Check if 'code-keeper' Group exists
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/code-keeper"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: [200, 404]
  register: group_check

- name: Create 'code-keeper' Group
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      name: "code-keeper"
      path: "code-keeper"
      visibility: "public"
    status_code: [201, 400]
  when: group_check.status == 404

- name: Get 'code-keeper' Group Details (to retrieve numeric ID)
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/code-keeper"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
  register: group_info

- name: Create the 4 Repositories under code-keeper Group
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/projects"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      name: "{{ item }}"
      path: "{{ item }}"
      namespace_id: "{{ group_info.json.id }}"
      visibility: "public"
      initialize_with_readme: false
    status_code: [201, 400]
  loop:
    - terraform
    - api-gateway
    - inventory
    - billing

- name: Ensure SSH directory exists on host machine
  ansible.builtin.file:
    path: "{{ host_ssh_public_key_path | dirname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Check if SSH public key exists on host machine
  ansible.builtin.stat:
    path: "{{ host_ssh_public_key_path }}"
  register: ssh_key_stat
  delegate_to: localhost
  become: false

- name: Generate SSH key pair if not present
  community.crypto.openssh_keypair:
    path: "{{ host_ssh_public_key_path | regex_replace('\\.pub$', '') }}"
    type: ed25519
    comment: "admin@code-keeper.local"
    state: present
  delegate_to: localhost
  become: false
  when: not ssh_key_stat.stat.exists

- name: Read local host SSH public key
  ansible.builtin.slurp:
    src: "{{ host_ssh_public_key_path }}"
  register: ssh_key_content
  delegate_to: localhost
  become: false

- name: Check existing SSH keys on GitLab root user
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/user/keys"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
  register: existing_keys

- name: Add host SSH key to GitLab root user if not already present
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/user/keys"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      title: "Host Deployment Key (Automated)"
      key: "{{ ssh_key_content.content | b64decode | trim }}"
    status_code: [201, 400]
  when: "ssh_key_content.content | b64decode | trim not in (existing_keys.json | map(attribute='key') | list)"

- name: Delete stale AWS CI/CD variables from Group
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/code-keeper/variables/{{ item }}"
    method: DELETE
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: [204, 404]
  loop:
    - "AWS_ACCESS_KEY_ID"
    - "AWS_SECRET_ACCESS_KEY"
    - "AWS_DEFAULT_REGION"
    - "AWS_ACCOUNT_ID"

- name: Define fresh AWS CI/CD variables at Group Level
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/code-keeper/variables"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      key: "{{ item.key }}"
      value: "{{ item.value | trim }}"
      protected: false
      masked: "{{ item.masked | default(false) }}"
    status_code: [201, 400] # 400 if variable already exists
  loop:
    - { key: 'AWS_ACCESS_KEY_ID', value: "{{ aws_access_key_id }}", masked: false }
    - { key: 'AWS_SECRET_ACCESS_KEY', value: "{{ aws_secret_access_key }}", masked: true }
    - { key: 'AWS_DEFAULT_REGION', value: "{{ aws_default_region }}", masked: false }
    - { key: 'AWS_ACCOUNT_ID', value: "{{ aws_account_id }}", masked: false }

- name: Delete stale TF_VAR CI/CD variables from Group
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/code-keeper/variables/{{ item }}"
    method: DELETE
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: [204, 404]
  loop:
    - "TF_VAR_services"
    - "TF_VAR_apigateway_port"
    - "TF_VAR_inventory_app_port"
    - "TF_VAR_billing_app_port"
    - "TF_VAR_rabbitmq_port"
    - "TF_VAR_inventory_db_port"
    - "TF_VAR_billing_db_port"
    - "TF_VAR_dockerhub_password"
    - "TF_VAR_certificate_arn"
    - "TF_VAR_backend_server_name"

- name: Define Terraform TF_VAR CI/CD variables at Group Level
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/code-keeper/variables"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      key: "{{ item.key }}"
      value: "{{ item.value | string | trim }}"
      protected: false
      masked: "{{ item.masked | default(false) }}"
    status_code: [201, 400]
  loop:
    - key: 'TF_VAR_services'
      value: '{ gateway = { type = "backend", image = "madagha/api-gateway:latest", container_port = 8080, cpu = 256, memory = 512, desired_count = 1 }, inventory = { type = "backend", image = "madagha/inventory:latest", container_port = 8081, cpu = 256, memory = 512, desired_count = 1 }, billing = { type = "backend", image = "madagha/billing:latest", container_port = 8082, cpu = 256, memory = 512, desired_count = 1 } }'
      masked: false
    - { key: 'TF_VAR_apigateway_port', value: '8080', masked: false }
    - { key: 'TF_VAR_inventory_app_port', value: '8081', masked: false }
    - { key: 'TF_VAR_billing_app_port', value: '8082', masked: false }
    - { key: 'TF_VAR_rabbitmq_port', value: '5672', masked: false }
    - { key: 'TF_VAR_inventory_db_port', value: '5432', masked: false }
    - { key: 'TF_VAR_billing_db_port', value: '5433', masked: false }
    - { key: 'TF_VAR_certificate_arn', value: "{{ certificate_arn }}", masked: false }
    - { key: 'TF_VAR_backend_server_name', value: 'api.code-keeper.local', masked: false }

- name: Define Docker Hub password for Terraform when configured
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/api/v4/groups/code-keeper/variables"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    body_format: json
    body:
      key: "TF_VAR_dockerhub_password"
      value: "{{ dockerhub_password }}"
      protected: false
      masked: true
    status_code: [201, 400]
  when: dockerhub_password | default('') | length > 0

- name: Push microservices code to GitLab repositories via Git Subtree
  ansible.builtin.shell: |
    REPO_ROOT=$(git rev-parse --show-toplevel)
    cd "$REPO_ROOT"

    git branch -D temp-{{ item }} 2>/dev/null || true

    # Create subtree split and push to GitLab
    git subtree split --prefix=apps/{{ item }} -b temp-{{ item }}
    git push http://root:{{ gitlab_api_token }}@192.168.56.20/code-keeper/{{ item }}.git temp-{{ item }}:main --force
    git branch -D temp-{{ item }}
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  loop:
    - terraform
    - api-gateway
    - inventory
    - billing