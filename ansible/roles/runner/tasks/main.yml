---
- name: Install Docker and container prerequisites
  ansible.builtin.apt:
    name:
      - docker.io
      - curl
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: true

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Download GitLab Runner repository setup script
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh
    dest: /tmp/gitlab_runner_script.deb.sh
    mode: '0755'

- name: Run GitLab Runner repository setup script
  ansible.builtin.command:
    cmd: bash /tmp/gitlab_runner_script.deb.sh
    creates: /etc/apt/sources.list.d/runner_gitlab-runner.list

- name: Install gitlab-runner package
  ansible.builtin.apt:
    name: gitlab-runner
    state: present
    update_cache: true

- name: Add gitlab-runner user to docker group
  ansible.builtin.user:
    name: gitlab-runner
    groups: docker
    append: true

- name: Ensure gitlab-runner service is started and enabled
  ansible.builtin.service:
    name: gitlab-runner
    state: started
    enabled: true