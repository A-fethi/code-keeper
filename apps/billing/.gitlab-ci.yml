stages:
  - build
  - test
  - scan
  - containerize
  - deploy_staging
  - approval
  - deploy_production

# 1. BUILD STAGE
build_app:
  stage: build
  image: python:3.12-alpine
  script:
    - echo "Compiling Python source files..."
    - python -m compileall app/
    - echo "Build successful."

# 2. TEST STAGE
test_app:
  stage: test
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir -r requirements.txt pytest
  script:
    - echo "Running unit tests with pytest..."
    - python -m pytest -v

# 3. SCAN STAGE (Security SAST)
security_scan:
  stage: scan
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir bandit
  script:
    - echo "Scanning code for security vulnerabilities with Bandit..."
    - bandit -r app/ -ll -i

# 4. CONTAINERIZE STAGE
docker_build:
  stage: containerize
  image: docker:24.0.5
  retry: 2
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache aws-cli
    - ECR_URL="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - IMAGE_URL="$ECR_URL/cloud-design/billing-app"
    - |
      if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
        echo "Logging into AWS ECR at $ECR_URL..."
        aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URL
      else
        echo "WARNING: No AWS credentials found in environment. Build will continue locally."
      fi
  script:
    - ECR_URL="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - IMAGE_URL="$ECR_URL/cloud-design/billing-app"
    - echo "Building Docker image for billing ($IMAGE_URL)..."
    - docker build -t $IMAGE_URL:latest -t $IMAGE_URL:$CI_COMMIT_SHORT_SHA .
    - |
      if [ -n "$AWS_ACCESS_KEY_ID" ]; then
        echo "Pushing image to ECR..."
        docker push $IMAGE_URL:latest
        docker push $IMAGE_URL:$CI_COMMIT_SHORT_SHA
      fi
    - echo "Image build completed successfully."

# 5. DEPLOY TO STAGING
staging_deploy:
  stage: deploy_staging
  image: amazon/aws-cli:latest
  environment:
    name: staging
  script:
    - echo "Deploying billing to Staging environment..."
    - aws ecs update-service --cluster cloud-design-cluster --service cloud-design-billing-app-service --force-new-deployment --region ${AWS_DEFAULT_REGION:-us-east-1}
    - echo "Deployment triggered successfully."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 6. MANUAL APPROVAL GATE
production_approval:
  stage: approval
  environment:
    name: production
  script:
    - echo "Production deployment for billing approved by stakeholder."
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 7. DEPLOY TO PRODUCTION
production_deploy:
  stage: deploy_production
  image: amazon/aws-cli:latest
  environment:
    name: production
  script:
    - echo "Deploying billing to Production environment..."
    - aws ecs update-service --cluster cloud-design-cluster --service cloud-design-billing-app-service --force-new-deployment --region ${AWS_DEFAULT_REGION:-us-east-1}
    - echo "Zero-downtime rolling update completed successfully."
  needs:
    - production_approval
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
