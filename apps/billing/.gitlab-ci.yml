production_deploy:
  stage: deploy_production
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]

  environment:
    name: production

  script:
    - echo "Checking AWS ECS production infrastructure..."

    - |
      aws ecs describe-clusters \
        --clusters code-keeper-prod-cluster \
        --region "${AWS_DEFAULT_REGION:-eu-west-3}" \
        --query "clusters[0].status" \
        --output text

    - echo "Checking Billing production ECS service..."

    - |
      aws ecs describe-services \
        --cluster code-keeper-prod-cluster \
        --services code-keeper-prod-billing \
        --region "${AWS_DEFAULT_REGION:-eu-west-3}" \
        --query "services[0].status" \
        --output text

    - echo "Production infrastructure exists. Deploying billing..."

    - |
      aws ecs update-service \
        --cluster code-keeper-prod-cluster \
        --service code-keeper-prod-billing \
        --force-new-deployment \
        --region "${AWS_DEFAULT_REGION:-eu-west-3}"

    - echo "Billing production deployment triggered successfully."
  # test 1
  needs:
    - production_approval

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

