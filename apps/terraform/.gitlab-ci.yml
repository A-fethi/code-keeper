image:
  name: hashicorp/terraform:1.6
  entrypoint: [""]

stages:
  - init
  - validate
  - plan
  - apply_staging
  - approval
  - apply_production

before_script:
  - terraform --version
  - terraform init

# 1. INIT STAGE
terraform_init:
  stage: init
  script:
    - echo "Terraform initialization successful."
    - terraform version

# 2. VALIDATE STAGE
terraform_validate:
  stage: validate
  script:
    - terraform validate
    - echo "Validation passed."

# 3. PLAN STAGE
terraform_plan:
  stage: plan
  script:
    - terraform plan -out=tfplan
  artifacts:
    name: "tfplan-$CI_COMMIT_SHORT_SHA"
    paths:
      - tfplan
    expire_in: 1 hour

# 4. APPLY TO STAGING
apply_staging:
  stage: apply_staging
  environment:
    name: staging
  needs:
    - job: terraform_plan
      artifacts: true
  script:
    - echo "Applying infrastructure changes to STAGING environment..."
    - terraform apply -auto-approve tfplan
    - echo "Staging apply completed successfully."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 5. MANUAL APPROVAL GATE
production_approval:
  stage: approval
  environment:
    name: production
  script:
    - echo "Production deployment approved by $GITLAB_USER_LOGIN at $(date)."
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 6. APPLY TO PRODUCTION
apply_production:
  stage: apply_production
  environment:
    name: production
  needs:
    - job: terraform_plan
      artifacts: true
    - production_approval
  script:
    - echo "Applying infrastructure changes to PRODUCTION environment..."
    - terraform apply -auto-approve tfplan
    - echo "Production apply completed successfully."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
