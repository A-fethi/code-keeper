image:
  name: hashicorp/terraform:1.6
  entrypoint: [""]

stages:
  - init
  - validate
  - plan_staging
  - apply_staging
  - approval
  - apply_production
  - trigger_microservices
  - destroy

before_script:
  - terraform --version
  - export AWS_REGION="us-east-1"
  - terraform init

# 1. INIT
terraform_init:
  stage: init
  script:
    - terraform version

# 2. VALIDATE
terraform_validate:
  stage: validate
  script:
    - terraform validate

# 3. PLAN STAGING
plan_staging:
  stage: plan_staging
  script:
    - terraform workspace select staging || terraform workspace new staging
    - terraform plan -out=tfplan-staging
  artifacts:
    name: "tfplan-staging"
    paths:
      - tfplan-staging
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 4. APPLY STAGING
apply_staging:
  stage: apply_staging
  environment:
    name: staging
  needs:
    - job: plan_staging
      artifacts: true
  script:
    - terraform workspace select staging || terraform workspace new staging
    - echo "Applying infrastructure changes to STAGING..."
    - terraform apply -auto-approve tfplan-staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 5. PRODUCTION APPROVAL GATE
production_approval:
  stage: approval
  environment:
    name: production
  script:
    - echo "Production release approved."
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 6. MOCK PRODUCTION APPLY
apply_production:
  stage: apply_production
  environment:
    name: production
  needs:
    - job: production_approval
  script:
    - 'echo "PROD MODE: Reusing Staging cluster to avoid AWS Free Tier overages."'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 7. TRIGGER DOWNSTREAM MICROSERVICES
trigger_api_gateway:
  stage: trigger_microservices
  needs:
    - job: apply_staging
  trigger:
    project: code-keeper/api-gateway
    branch: main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

trigger_inventory:
  stage: trigger_microservices
  needs:
    - job: apply_staging
  trigger:
    project: code-keeper/inventory
    branch: main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

trigger_billing:
  stage: trigger_microservices
  needs:
    - job: apply_staging
  trigger:
    project: code-keeper/billing
    branch: main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 8. TEARDOWN
destroy_infrastructure:
  stage: destroy
  script:
    - terraform workspace select staging
    - terraform destroy -auto-approve
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'