stages:
  - build
  - test
  - scan
  - containerize
  - deploy_staging
  - approval
  - deploy_production
  
# 1. BUILD STAGE
build_app:
  stage: build
  image: python:3.12-alpine
  script:
    - echo "Compiling Python source files..."
    - python -m compileall app/
    - echo "Build successful."

# 2. TEST STAGE
test_app:
  stage: test
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir -r requirements.txt pytest
  script:
    - echo "Running unit tests with pytest..."
    - python -m pytest -v

# 3. SCAN STAGE (Security SAST)
security_scan:
  stage: scan
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir bandit
  script:
    - echo "Scanning code for security vulnerabilities with Bandit..."
    - bandit -r app/ -ll -i

# 4. CONTAINERIZE STAGE
docker_build:
  stage: containerize
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building Docker image for inventory..."
    - docker build -t inventory:latest .
    - echo "Docker image built successfully."

# 5. DEPLOY TO STAGING
staging_deploy:
  stage: deploy_staging
  image: alpine:latest
  environment:
    name: staging
  script:
    - echo "Deploying inventory to Staging environment..."
    - echo "Staging health check ==> OK"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 6. MANUAL APPROVAL GATE
production_approval:
  stage: approval
  environment:
    name: production
  script:
    - echo "Production deployment for inventory approved by stakeholder."
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 7. DEPLOY TO PRODUCTION
production_deploy:
  stage: deploy_production
  image: alpine:latest
  environment:
    name: production
  script:
    - echo "Deploying inventory to Production environment..."
    - echo "Zero-downtime rolling update completed successfully."
  needs:
    - production_approval
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
